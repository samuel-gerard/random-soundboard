<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Soundboard Increvable</title>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        button {
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
        .btn-sound { background: #00adb5; color: white; }
        .btn-chaos { background: #ff5722; color: white; }
        .btn-chaos.active { background: #28a745; }
    </style>
</head>
<body>

<div class="box">
    <h1>🔊 Soundboard 100% Synthétique</h1>
    <p>Aucun chargement, aucun serveur, zéro erreur.</p>
    
    <button class="btn-sound" onclick="jouerSonRandom()">🎵 FAIRE UN SON</button>
    
    <hr style="border: 1px solid #333; margin: 20px 0;">
    
    <button id="chaos-btn" class="btn-chaos" onclick="toggleChaos()">DÉMARRER LE CHAOS</button>
</div>

<script>
    let chaosTimer = null;
    let audioCtx = null;

    // Initialise l'audio au premier clic (obligation des navigateurs)
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    // Génère un son électronique à la volée (Zéro fichier MP3 !)
    function jouerSon(frequence, duree, type = 'sine') {
        initAudio();
        
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = type; // 'sine', 'square', 'sawtooth', 'triangle'
        oscillator.frequency.value = frequence;

        // Gestion du volume pour éviter les "clics" de fin de son
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duree);

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + duree);
    }

    // Crée une note au pif
    function jouerSonRandom() {
        const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25]; // Gamme de Do
        const types = ['sine', 'triangle', 'sawtooth'];
        
        const freqRandom = notes[Math.floor(Math.random() * notes.length)];
        const typeRandom = types[Math.floor(Math.random() * types.length)];
        const dureeRandom = Math.random() * 0.4 + 0.1; // Entre 0.1 et 0.5 secondes

        jouerSon(freqRandom, dureeRandom, typeRandom);
    }

    // Gestion de la boucle de l'enfer
    function toggleChaos() {
        const btn = document.getElementById('chaos-btn');
        
        if (chaosTimer) {
            clearTimeout(chaosTimer);
            chaosTimer = null;
            btn.innerText = "DÉMARRER LE CHAOS";
            btn.classList.remove('active');
        } else {
            btn.innerText = "ARRÊTER LE CHAOS";
            btn.classList.add('active');
            boucleChaos();
        }
    }

    function boucleChaos() {
        jouerSonRandom();
        
        // Intervalle random entre 0.3 et 1.5 secondes
        const prochainIntervalle = (Math.random() * 1.2 + 0.3) * 1000;
        
        chaosTimer = setTimeout(boucleChaos, prochainIntervalle);
    }
</script>

</body>
</html>
