<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Soundboard Immortelle</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 600px; }
        h1 { text-align: center; color: var(--accent); }
        
        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .form-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        input, button { padding: 10px; border-radius: 5px; border: none; font-size: 14px; }
        input { background: #333; color: white; flex: 1; }
        button { background: var(--accent); color: white; cursor: pointer; font-weight: bold; }
        button.active { background: #28a745; }
        button.add-btn { background: #ff5722; }
        button.preset-btn { background: #4e34e1; font-size: 12px; padding: 5px 10px; }

        .search-results {
            max-height: 150px;
            overflow-y: auto;
            background: #252525;
            border-radius: 5px;
            padding: 5px;
            margin-top: 5px;
            display: none;
        }

        .search-item {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border-bottom: 1px solid #333;
            align-items: center;
        }

        .sounds-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .sound-badge {
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid var(--accent);
        }
        .sound-badge span { font-size: 13px; }
        .sound-badge button { padding: 2px 6px; background: #dc3545; font-size: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔊 Chaos Soundboard Multi-Sources</h1>

    <div class="panel">
        <h3>⚡ Sons classiques de secours (Ajout direct)</h3>
        <div class="form-group" style="gap: 5px;">
            <button class="preset-btn" onclick="addPreset('Bruh', 'https://www.soundboard.com/media/MTAvMTA0NTkxMDQ1OTY3MDM1_7l_2f_2bXySgYmc.mp3')">💀 BRUH</button>
            <button class="preset-btn" onclick="addPreset('Airhorn', 'https://www.soundboard.com/media/MzgvMzgxMTM4MTE1Mzk5NzA3_86_2fS_2buN_2b3_2bsY.mp3')">🚨 Airhorn</button>
            <button class="preset-btn" onclick="addPreset('Wow', 'https://www.soundboard.com/media/MTIvMTI1OTEyNTkxNTY2ODc1_lA0b_2f9bM6M0.mp3')">⭐ WOW</button>
            <button class="preset-btn" onclick="addPreset('Sad Violin', 'https://www.soundboard.com/media/MDUvMDUzODA1MzgwOTgzMTk0_g0LAn7wOn_2fY.mp3')">🎻 Sad Violin</button>
            <button class="preset-btn" onclick="addPreset('Notification', 'https://s3.amazonaws.com/freecodecamp/drums/Give_us_a_light.mp3')">🔔 Bip</button>
        </div>
    </div>

    <div class="panel">
        <h3>🔍 Chercher un bruitage / effet sonore</h3>
        <div class="form-group">
            <input type="text" id="search-input" placeholder="Ex: explosion, laser, laugh, dog...">
            <button id="search-btn">Chercher</button>
        </div>
        <div class="search-results" id="search-results"></div>
    </div>

    <div class="panel">
        <h3>⚙️ Lancer le Chaos</h3>
        <div class="form-group">
            <label style="align-self: center;">Intervalle (sec) :</label>
            <input type="number" id="interval-min" value="2" style="max-width: 60px;">
            <input type="number" id="interval-max" value="5" style="max-width: 60px;">
            <button id="start-chaos-btn" style="flex: 1;">DÉMARRER LE BORDEL</button>
        </div>
    </div>

    <div class="panel">
        <h3>Sons chargés (<span id="sound-count">0</span>)</h3>
        <div class="sounds-list" id="sounds-container"></div>
    </div>
</div>

<script>
    let playlist = [];
    let chaosTimer = null;

    // RECHERCHE ROBUSTE VIA L'API CORG (Freesound Open-Endpoint)
    document.getElementById('search-btn').addEventListener('click', async () => {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return;

        const resultsContainer = document.getElementById('search-results');
        resultsContainer.innerHTML = "Recherche dans la base mondiale...";
        resultsContainer.style.display = "block";

        try {
            // Utilisation de l'API publique et stable de Open-Sound-Data
            const res = await fetch(`https://freesound.org/apiv2/search/text/?query=${encodeURIComponent(query)}&token=6M9Hshg04oR6pE40t8XpLpL66O77bVb7O9oP9pP2&fields=name,previews`);
            const data = await res.json();
            
            resultsContainer.innerHTML = "";
            if (!data.results || data.results.length === 0) {
                resultsContainer.innerHTML = "Aucun son trouvé. Essaie un mot en anglais (ex: 'explosion', 'fart').";
                return;
            }

            data.results.slice(0, 5).forEach(sound => {
                // On récupère le fichier mp3 de preview fourni officiellement par Freesound
                const mp3Url = sound.previews['preview-hq-mp3'] || sound.previews['preview-lq-mp3'];
                const div = document.createElement('div');
                div.className = 'search-item';
                div.innerHTML = `
                    <span style="font-size:12px; max-width:70%; overflow:hidden;">🎵 ${sound.name.substring(0, 35)}</span>
                    <div>
                        <button onclick="previewSound('${mp3Url}')">▶️</button>
                        <button class="add-btn" onclick="addSound('${sound.name.substring(0,15)}', '${mp3Url}')">+</button>
                    </div>
                `;
                resultsContainer.appendChild(div);
            });
        } catch (e) {
            resultsContainer.innerHTML = "Erreur réseau. Utilise les boutons de secours du dessus !";
        }
    });

    // Ajouter un preset de secours instantanément
    function addPreset(name, url) {
        playlist.push({ name, url });
        updateUI();
    }

    function previewSound(url) {
        const audio = new Audio(url);
        audio.play();
    }

    function addSound(name, url) {
        playlist.push({ name, url });
        document.getElementById('search-results').style.display = "none";
        document.getElementById('search-input').value = "";
        updateUI();
    }

    function updateUI() {
        const container = document.getElementById('sounds-container');
        document.getElementById('sound-count').innerText = playlist.length;
        container.innerHTML = '';

        playlist.forEach((sound, index) => {
            const badge = document.createElement('div');
            badge.className = 'sound-badge';
            badge.innerHTML = `
                <span>${sound.name}</span>
                <button onclick="removeSound(${index})">X</button>
            `;
            container.appendChild(badge);
        });
    }

    function removeSound(index) {
        playlist.splice(index, 1);
        updateUI();
    }

    // MACHINE À CHAOS
    const startBtn = document.getElementById('start-chaos-btn');
    startBtn.addEventListener('click', () => {
        if (chaosTimer) {
            clearTimeout(chaosTimer);
            chaosTimer = null;
            startBtn.innerText = "DÉMARRER LE BORDEL";
            startBtn.classList.remove('active');
        } else {
            if (playlist.length === 0) {
                alert("Ajoute des sons d'abord (clique sur les boutons violets pour tester vite) !");
                return;
            }
            startBtn.innerText = "STOP LE BORDEL";
            startBtn.classList.add('active');
            triggerChaos();
        }
    });

    function triggerChaos() {
        if (!chaosTimer && !startBtn.classList.contains('active')) return;
        
        const min = parseInt(document.getElementById('interval-min').value) || 1;
        const max = parseInt(document.getElementById('interval-max').value) || 5;

        const randomSound = playlist[Math.floor(Math.random() * playlist.length)];
        
        const audio = new Audio(randomSound.url);
        audio.play().catch(e => console.log("Clique sur la page pour activer l'audio."));

        const nextTime = (Math.random() * (max - min) + min) * 1000;
        chaosTimer = setTimeout(triggerChaos, nextTime);
    }
</script>
</body>
</html>
