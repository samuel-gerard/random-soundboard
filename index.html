<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Soundboard Ultra-Simple</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #00adb5;
            --text: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { width: 100%; max-width: 600px; }
        h1 { text-align: center; color: var(--accent); }
        
        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .form-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input, button { padding: 10px; border-radius: 5px; border: none; font-size: 14px; }
        input { background: #333; color: white; flex: 1; }
        button { background: var(--accent); color: white; cursor: pointer; font-weight: bold; }
        button.active { background: #28a745; }
        button.add-btn { background: #ff5722; }

        .search-results {
            max-height: 150px;
            overflow-y: auto;
            background: #252525;
            border-radius: 5px;
            padding: 5px;
            margin-top: 5px;
            display: none;
        }

        .search-item {
            display: flex;
            justify-content: space-between;
            padding: 5px;
            border-bottom: 1px solid #333;
            align-items: center;
        }

        .sounds-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 15px; }
        .sound-badge {
            background: #2a2a2a;
            padding: 8px 12px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px solid var(--accent);
        }
        .sound-badge span { font-size: 13px; }
        .sound-badge button { padding: 2px 6px; background: #dc3545; font-size: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔊 Chaos Soundboard Instantanée</h1>

    <div class="panel">
        <h3>1. Chercher un son de mème</h3>
        <div class="form-group">
            <input type="text" id="search-input" placeholder="Ex: bruh, airhorn, non, risitas...">
            <button id="search-btn">Chercher</button>
        </div>
        <div class="search-results" id="search-results"></div>
    </div>

    <div class="panel">
        <h3>2. Lancer le Chaos</h3>
        <div class="form-group">
            <input type="number" id="interval-min" value="2" style="max-width: 70px;">
            <input type="number" id="interval-max" value="5" style="max-width: 70px;">
            <button id="start-chaos-btn" style="flex: 1;">DÉMARRER LE BORDEL</button>
        </div>
    </div>

    <div class="panel">
        <h3>Sons chargés (<span id="sound-count">0</span>)</h3>
        <div class="sounds-list" id="sounds-container"></div>
    </div>
</div>

<script>
    let playlist = [];
    let chaosTimer = null;

    // 1. RECHERCHE VIA L'API INTERNE (Cors proxy public pour choper les mp3 de MyInstants)
    document.getElementById('search-btn').addEventListener('click', async () => {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return;

        const resultsContainer = document.getElementById('search-results');
        resultsContainer.innerHTML = "Recherche en cours...";
        resultsContainer.style.display = "block";

        try {
            // Utilisation d'un utilitaire de recherche MyInstants non officiel via proxy
            const res = await fetch(`https://it.ay7.de/api/myinstants?search=${encodeURIComponent(query)}`);
            const data = await res.json();
            
            resultsContainer.innerHTML = "";
            if (!data.results || data.results.length === 0) {
                resultsContainer.innerHTML = "Aucun son trouvé.";
                return;
            }

            data.results.slice(0, 5).forEach(sound => {
                const div = document.createElement('div');
                div.className = 'search-item';
                div.innerHTML = `
                    <span>🎵 ${sound.name}</span>
                    <div>
                        <button onclick="previewSound('${sound.mp3}')">▶️</button>
                        <button class="add-btn" onclick="addSound('${sound.name}', '${sound.mp3}')">+</button>
                    </div>
                `;
                resultsContainer.appendChild(div);
            });
        } catch (e) {
            resultsContainer.innerHTML = "Erreur de recherche. Réessaye.";
        }
    });

    // Écouter l'audio en preview
    function previewSound(url) {
        const audio = new Audio(url);
        audio.play();
    }

    // Ajouter à la liste dynamique
    function addSound(name, url) {
        playlist.push({ name, url });
        document.getElementById('search-results').style.display = "none";
        document.getElementById('search-input').value = "";
        updateUI();
    }

    function updateUI() {
        const container = document.getElementById('sounds-container');
        document.getElementById('sound-count').innerText = playlist.length;
        container.innerHTML = '';

        playlist.forEach((sound, index) => {
            const badge = document.createElement('div');
            badge.className = 'sound-badge';
            badge.innerHTML = `
                <span>${sound.name}</span>
                <button onclick="removeSound(${index})">X</button>
            `;
            container.appendChild(badge);
        });
    }

    function removeSound(index) {
        playlist.splice(index, 1);
        updateUI();
    }

    // 2. LA MACHINE À CHAOS (Audio HTML5 pur, pas de bug, pas d'iframe)
    const startBtn = document.getElementById('start-chaos-btn');
    startBtn.addEventListener('click', () => {
        if (chaosTimer) {
            clearTimeout(chaosTimer);
            chaosTimer = null;
            startBtn.innerText = "DÉMARRER LE BORDEL";
            startBtn.classList.remove('active');
        } else {
            if (playlist.length === 0) {
                alert("Ajoute des sons d'abord !");
                return;
            }
            startBtn.innerText = "STOP LE BORDEL";
            startBtn.classList.add('active');
            triggerChaos();
        }
    });

    function triggerChaos() {
        const min = parseInt(document.getElementById('interval-min').value) || 1;
        const max = parseInt(document.getElementById('interval-max').value) || 5;

        // Choix random du son
        const randomSound = playlist[Math.floor(Math.random() * playlist.length)];
        
        // Lecture HTML5 native instantanée
        const audio = new Audio(randomSound.url);
        audio.play().catch(e => console.log("L'autoplay a bloqué ce coup-ci, clique sur la page."));

        // Prochain trigger
        const nextTime = (Math.random() * (max - min) + min) * 1000;
        chaosTimer = setTimeout(triggerChaos, nextTime);
    }
</script>
</body>
</html>
