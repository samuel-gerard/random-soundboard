<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Chaos Soundboard</title>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 420px;
            width: 100%;
        }
        .inputs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 80px;
            padding: 10px;
            background: #333;
            border: 2px solid #444;
            color: white;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
        input:focus { border-color: #00adb5; outline: none; }
        
        /* Selecteur de Mode */
        .mode-selector {
            background: #151515;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
            border: 1px solid #333;
        }
        .mode-option {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .mode-option input { width: auto; cursor: pointer; }

        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #00adb5;
            color: white;
            box-shadow: 0 4px 0 #00666b;
            transition: all 0.1s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        button.active {
            background: #28a745;
            box-shadow: 0 4px 0 #1e7e34;
        }
        .info-list {
            font-size: 11px;
            color: #888;
            margin-top: 20px;
            text-align: left;
            background: #151515;
            padding: 12px;
            border-radius: 5px;
            max-height: 100px;
            overflow-y: auto;
        }
        .info-list ul { margin: 5px 0 0 0; padding-left: 15px; }
        .status {
            font-size: 13px;
            color: #ff5722;
            margin-top: 10px;
            font-weight: bold;
            height: 18px;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>🔊 Laboratoire du Chaos</h1>
    
    <!-- CHOIX DU MODE -->
    <div class="mode-selector">
        <label class="mode-option">
            <input type="radio" name="engine-mode" value="mp3" checked onchange="switchMode()">
            📁 Mèmes MP3 (Régulier)
        </label>
        <label class="mode-option">
            <input type="radio" name="engine-mode" value="synth" onchange="switchMode()">
            ⚡ Synthé (Chaos Pop)
        </label>
    </div>
    
    <div class="inputs">
        <div class="input-group">
            <label id="lbl-min">Min (sec)</label>
            <input type="number" id="time-min" value="1.0" step="0.1" min="0.05">
        </div>
        <div class="input-group">
            <label id="lbl-max">Max (sec)</label>
            <input type="number" id="time-max" value="3.0" step="0.1" min="0.05">
        </div>
    </div>

    <button id="chaos-btn" onclick="toggleChaos()">DÉMARRER LE BORDEL</button>
    <div id="status-text" class="status"></div>

    <div class="info-list" id="playlist-box">
        <strong>📦 Fichiers MP3 configurés (<span id="total-count">0</span>) :</strong>
        <ul id="liste-sons"></ul>
    </div>
</div>

<script>
    // Liste mise à jour (Sans Max Verstappen)
    const sonsDeMeme = [
        "nudgemega.mp3",
        "applepay.mp3",
        "sentmessage_1.mp3",
        "slack-new-message.mp3",
        "snapchat-message.mp3",
        "facebook-chat-sound-hd.mp3",
        "pop_1lzEdx1.mp3",
        "msn-sound_1.mp3",
        "discord-notification.mp3",
        "m-e-o-w.mp3"
    ];

    let chaosTimer = null;
    let audioCtx = null;

    // Remplissage initial de la liste MP3
    document.getElementById('total-count').innerText = sonsDeMeme.length;
    const listEl = document.getElementById('liste-sons');
    sonsDeMeme.forEach(son => {
        const li = document.createElement('li');
        li.innerText = son;
        listEl.appendChild(li);
    });

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // Changement visuel selon le mode sélectionné
    function switchMode() {
        const mode = document.querySelector('input[name="engine-mode"]:checked').value;
        const playlistBox = document.getElementById('playlist-box');
        const btn = document.getElementById('chaos-btn');
        
        if (mode === 'synth') {
            playlistBox.style.display = 'none';
            btn.style.background = '#ff5722';
            btn.style.boxShadow = '0 4px 0 #b3360e';
        } else {
            playlistBox.style.display = 'block';
            btn.style.background = '#00adb5';
            btn.style.boxShadow = '0 4px 0 #00666b';
        }
    }

    // --- GENERATEUR SYNTHETIQUE (ANCIENNE VERSION SANS MP3) ---
    function triggerSynthBoom() {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        // Formes d'ondes et fréquences totalement aléatoires pour que ça pop de partout
        const types = ['sine', 'square', 'sawtooth', 'triangle'];
        osc.type = types[Math.floor(Math.random() * types.length)];
        
        const baseFreq = Math.random() * 800 + 100; 
        const duration = Math.random() * 0.3 + 0.1;

        osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
        // Effet glissant aléatoire (un coup aigu, un coup grave)
        if(Math.random() > 0.5) {
            osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        } else {
            osc.frequency.linearRampToValueAtTime(baseFreq * 2, audioCtx.currentTime + duration);
        }
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime); // Volume modéré pour la superposition
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // --- LECTEUR MP3 UNIQUE ---
    function jouerUnMemeMP3() {
        initAudio();
        const sonChoisi = sonsDeMeme[Math.floor(Math.random() * sonsDeMeme.length)];
        const audio = new Audio(sonChoisi);
        audio.play().catch(e => console.log("L'autoplay bloque ? Clic requis."));
        document.getElementById('status-text').innerText = `💥 MP3 : ${sonChoisi}`;
    }

    // --- GESTION DE LA BOUCLE ---
    function toggleChaos() {
        const btn = document.getElementById('chaos-btn');
        const statusText = document.getElementById('status-text');
        initAudio(); 

        if (chaosTimer) {
            clearTimeout(chaosTimer);
            chaosTimer = null;
            btn.innerText = "DÉMARRER LE BORDEL";
            btn.classList.remove('active');
            statusText.innerText = "Machine arrêtée.";
            switchMode(); // Remet la couleur du mode
        } else {
            btn.innerText = "ARRÊTER LE CHAOS";
            btn.classList.add('active');
            statusText.innerText = "Calcul du premier saut...";
            runChaosEngine();
        }
    }

    function runChaosEngine() {
        const btn = document.getElementById('chaos-btn');
        if (!btn.classList.contains('active')) return;

        const mode = document.querySelector('input[name="engine-mode"]:checked').value;

        // Déclenchement du son selon le mode
        if (mode === 'mp3') {
            jouerUnMemeMP3();
        } else {
            triggerSynthBoom();
            document.getElementById('status-text').innerText = `⚡ Pop Synthétique !`;
        }

        // Récupération des fréquences de tir
        let min = parseFloat(document.getElementById('time-min').value) || 0.2;
        let max = parseFloat(document.getElementById('time-max').value) || 2.0;
        
        // Sécurité anti-crash
        if (min < 0.02) min = 0.02;
        if (max < min) max = min;

        const nextTrigger = (Math.random() * (max - min) + min) * 1000;

        // Si on est en mode Synth et qu'on a réglé très bas (ex: 0.1 / 0.1), 
        // les bips vont s'enchaîner tellement vite qu'ils vont se superposer magnifiquement.
        chaosTimer = setTimeout(runChaosEngine, nextTrigger);
    }
</script>

</body>
</html>
