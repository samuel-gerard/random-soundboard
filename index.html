<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Soundboard Officielle</title>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
        }
        .inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        input {
            width: 70px;
            padding: 8px;
            background: #333;
            border: none;
            color: white;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #e10600; /* Rouge F1 */
            color: white;
            box-shadow: 0 4px 0 #990400;
            transition: all 0.1s;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        button.active {
            background: #28a745;
            box-shadow: 0 4px 0 #1e7e34;
        }
        .info-list {
            font-size: 12px;
            color: #aaa;
            margin-top: 20px;
            text-align: left;
            background: #151515;
            padding: 12px;
            border-radius: 5px;
            border-left: 3px solid #e10600;
        }
        .info-list ul { margin: 5px 0 0 0; padding-left: 20px; }
    </style>
</head>
<body>

<div class="box">
    <h1>🏎️ Chaos Soundboard Premium</h1>
    <p>Intervalles configurables en secondes.</p>
    
    <div class="inputs">
        <div>
            <label style="display:block;font-size:12px;margin-bottom:5px;">Min (sec)</label>
            <input type="number" id="time-min" value="0.2" step="0.1" min="0.1">
        </div>
        <div>
            <label style="display:block;font-size:12px;margin-bottom:5px;">Max (sec)</label>
            <input type="number" id="time-max" value="1.5" step="0.1" min="0.1">
        </div>
    </div>

    <button id="chaos-btn" onclick="toggleChaos()">DÉMARRER LE CHAOS</button>

    <div class="info-list">
        <strong>🔊 Playlist chargée en local :</strong>
        <ul id="liste-sons"></ul>
    </div>
</div>

<script>
    // Configuration exacte avec les noms de tes fichiers
    const sonsDeMeme = [
        "tu-tu-tu-du-max-verstappen.mp3",
        "discord-notification.mp3",
        "ca-va-peter_nR3lwZJ.mp3",
        "m-e-o-w.mp3",
        "cat-iphone-ringtone.mp3"
    ];

    let chaosTimer = null;
    let audioCtx = null;

    // Remplir la liste visuelle au démarrage
    const listEl = document.getElementById('liste-sons');
    sonsDeMeme.forEach(son => {
        const li = document.createElement('li');
        li.innerText = son.replace('.mp3', '');
        listEl.appendChild(li);
    });

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function jouerMemeRandom() {
        initAudio();

        const sonChoisi = sonsDeMeme[Math.floor(Math.random() * sonsDeMeme.length)];
        
        // Lecture locale (zéro blocage réseau/CORS)
        const audio = new Audio(sonChoisi);
        audio.play().catch(e => console.log("L'autoplay bloque ? Clique sur le gros bouton."));
    }

    function toggleChaos() {
        const btn = document.getElementById('chaos-btn');
        initAudio(); // Débloque le flux audio directement au clic

        if (chaosTimer) {
            clearTimeout(chaosTimer);
            chaosTimer = null;
            btn.innerText = "DÉMARRER LE CHAOS";
            btn.classList.remove('active');
        } else {
            btn.innerText = "ARRÊTER LE CHAOS";
            btn.classList.add('active');
            runLoop();
        }
    }

    function runLoop() {
        const btn = document.getElementById('chaos-btn');
        if (!btn.classList.contains('active')) return;

        jouerMemeRandom();

        let min = parseFloat(document.getElementById('time-min').value) || 0.1;
        let max = parseFloat(document.getElementById('time-max').value) || 1.0;
        
        if (min < 0.1) min = 0.1;
        if (max < min) max = min;

        const nextTrigger = (Math.random() * (max - min) + min) * 1000;
        chaosTimer = setTimeout(runLoop, nextTrigger);
    }
</script>

</body>
</html>
